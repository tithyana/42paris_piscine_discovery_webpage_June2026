<!DOCTYPE html>
<html>
    <head>
        <title>Tab</title>
        
    </head>
    <body>
        <table style="position: absolute; border: 1px solid black; border-collapse: collapse; width: 100%; height: 100%;">
            <tr>
                <td style="width: 50%; background-color: #a6be5d; border: 1px solid black;">First cell</td>
                <td style="width: 50%; background-color: #e9bda9; border: 1px solid black;">Second cell</td>
            </tr>
        </table>
    </body>
</html>
